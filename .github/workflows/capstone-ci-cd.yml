name: Capstone CI/CD

on:
  push:
    branches:
      - main
      - capstone/security-hardening
  pull_request:
    branches:
      - main
      - capstone/security-hardening
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-scan:
    name: Build and scan application images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            image: example-voting-app-vote
            context: ./vote
          - service: result
            image: example-voting-app-result
            context: ./result
          - service: worker
            image: example-voting-app-worker
            context: ./worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: local/${{ matrix.image }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish images to GHCR
    needs: build-and-scan
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/capstone/security-hardening'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Vote image
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/example-voting-app-vote:${{ github.sha }}

      - name: Build and publish Result image
        uses: docker/build-push-action@v6
        with:
          context: ./result
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/example-voting-app-result:${{ github.sha }}

      - name: Build and publish Worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/example-voting-app-worker:${{ github.sha }}
